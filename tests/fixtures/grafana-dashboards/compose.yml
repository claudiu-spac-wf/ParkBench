name: parkbench-dashboard-fixture
services:
  fixture-exporter:
    image: node:24-bookworm-slim
    command: ["node", "/fixture-exporter.mjs"]
    volumes:
      - ./exporter.mjs:/fixture-exporter.mjs:ro
      - ../../../packages/contracts/src/openedge-db-metric-catalog.json:/native-catalog.json:ro
      - ../../../deploy/grafana/dashboards:/dashboards:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "127.0.0.1::9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1::3000"
    depends_on: [prometheus]
    volumes:
      - ./datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../../../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
