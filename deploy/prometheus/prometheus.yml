global:
  scrape_interval: ${PARKBENCH_PROMETHEUS_SCRAPE_INTERVAL}
  evaluation_interval: ${PARKBENCH_PROMETHEUS_SCRAPE_INTERVAL}
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["prometheus:9090"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: parkbench-platform
        action: keep
      - source_labels: [container_label_parkbench_managed]
        regex: "true"
        action: drop
  - job_name: parkbench-run-platform-cadvisor
    file_sd_configs: [{ files: ["/etc/prometheus/targets/*.json"], refresh_interval: 1s }]
    relabel_configs:
      - source_labels: [service]
        regex: cadvisor
        action: keep
      - source_labels: [project]
        regex: parkbench-platform
        action: keep
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: parkbench-platform
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        regex: .+
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
        action: replace
  - job_name: parkbench-run-owned-cadvisor
    metrics_path: /internal/cadvisor/metrics
    file_sd_configs: [{ files: ["/etc/prometheus/targets/*.json"], refresh_interval: 1s }]
    relabel_configs:
      - source_labels: [service]
        regex: run-cadvisor
        action: keep
      - source_labels: [run_id]
        target_label: __param_run_id
        action: replace
    metric_relabel_configs:
      - source_labels: [container_label_parkbench_managed]
        regex: "true"
        action: keep
      - source_labels: [container_label_parkbench_run_id]
        regex: .+
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        regex: .+
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
        action: replace
      - source_labels: [container_label_parkbench_component]
        target_label: component
        action: replace
  - job_name: parkbench-control-plane
    metrics_path: /internal/observer-metrics
    static_configs: [{ targets: ["control-plane:3000"] }]
  - job_name: node-exporter
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: parkbench-runs
    file_sd_configs: [{ files: ["/etc/prometheus/targets/*.json"], refresh_interval: 2s }]
    relabel_configs:
      - source_labels: [service]
        regex: cadvisor|run-cadvisor
        action: drop
